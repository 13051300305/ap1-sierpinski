<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AP1 · 交互式 2D 分形 — Sierpinski 垫片</title>
<style>
  body { margin: 0; background: #14161a; color: #e8e8e8;
         font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  canvas { background: #14161a; border: 1px solid #333; cursor: crosshair; }
  #panel { width: 260px; background: #1e2128; padding: 14px; border-radius: 8px; }
  #panel h2 { font-size: 15px; margin: 0 0 10px; }
  .row { margin-bottom: 12px; }
  .row label { display: block; font-size: 13px; margin-bottom: 4px; color: #aaa; }
  input[type=range] { width: 100%; }
  button { background: #2b303b; color: #eee; border: 1px solid #444;
           padding: 6px 10px; margin-right: 6px; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.active { background: #3a6ff0; }
  .hint { font-size: 12px; color: #888; line-height: 1.7; }
  select { width: 100%; background: #2b303b; color: #eee; border: 1px solid #444; padding: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl-canvas" width="720" height="720"></canvas>

  <div id="panel">
    <h2>AP1 · Sierpinski 垫片</h2>

    <div class="row">
      <label>生成方法</label>
      <label style="color:#eee"><input type="radio" name="method" id="method-chaos" checked> 混沌游戏</label>
      <label style="color:#eee"><input type="radio" name="method" id="method-sub"> 递归细分</label>
    </div>

    <div class="row">
      <label>渲染模式</label><br>
      <button id="mode-points">点云(1)</button>
      <button id="mode-lines">线框(2)</button>
      <button id="mode-tri">实体(3)</button>
    </div>

    <div class="row" id="sides-row">
      <label>多边形边数（E1 扩展）</label>
      <select id="sides">
        <option value="3" selected>三角形（3）</option>
        <option value="4">四边形（4）</option>
        <option value="5">五边形（5）</option>
        <option value="6">六边形（6）</option>
      </select>
    </div>

    <div class="row" id="point-count-row">
      <label>混沌点数：<span id="point-count-val">50000</span></label>
      <input type="range" id="point-count" min="5000" max="200000" step="5000" value="50000">
    </div>

    <div class="row" id="depth-row" style="display:none">
      <label>递归深度：<span id="depth-val">5</span></label>
      <input type="range" id="depth" min="0" max="6" step="1" value="5">
    </div>

    <div class="row">
      <label>点大小：<span id="point-size-val">2</span></label>
      <input type="range" id="point-size" min="1" max="8" step="0.5" value="2">
    </div>

    <div class="row">
      <label>配色方案</label>
      <select id="scheme">
        <option value="0">经典暖红</option>
        <option value="1">彩虹渐变</option>
        <option value="2">暗夜霓虹</option>
      </select>
    </div>

    <div class="hint">
      左键拖动：平移画布<br>
      滚轮：缩放<br>
      1 / 2 / 3：切换 点云/线框/实体<br>
      空格：暂停 / 继续逐点生长
    </div>
  </div>
</div>

<!-- 顶点着色器（WebGL 2.0 / GLSL ES 3.00） -->
<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es
in vec2 aPosition;
in vec3 aColor;
uniform vec2 uTranslation;   // 平移（鼠标拖拽）
uniform float uScale;        // 缩放（滚轮）
uniform float uPointSize;
out vec3 vColor;
void main() {
  vec2 pos = aPosition * uScale + uTranslation;
  gl_Position = vec4(pos, 0.0, 1.0);
  gl_PointSize = uPointSize;
  vColor = aColor;
}
</script>

<!-- 片元着色器 -->
<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es
precision mediump float;
in vec3 vColor;
out vec4 fColor;
void main() {
  fColor = vec4(vColor, 1.0);
}
</script>

<script src="Common/webgl-utils.js"></script>
<script src="Common/MV.js"></script>
<script src="Common/initShaders.js"></script>
<script src="js/geometry.js"></script>
<script src="js/interaction.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
